<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Site Probe</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; background: #f6f7f9; color: #1a1a1a; }
    main { max-width: 560px; margin: 14vh auto; padding: 1.5rem; }
    .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 10px; padding: 1.25rem 1.5rem; }
    h1 { font-size: 1.15rem; margin: 0 0 .4rem; }
    p { margin: 0; color: #4b5563; line-height: 1.5; }
    .badge { display: inline-block; margin-top: 1rem; padding: .3rem .65rem; border-radius: 999px;
             background: #ecfdf5; color: #047857; font-size: .8rem; }
  </style>
</head>
<body>
  <main>
    <div class="card">
      <h1>Site Probe</h1>
      <p>Lightweight uptime check endpoint for container demos. Returns healthy when the process is up.</p>
      <span class="badge">Operational</span>
    </div>
  </main>
</body>
</html>
